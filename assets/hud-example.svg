<svg xmlns="http://www.w3.org/2000/svg" width="480" height="640" viewBox="0 0 480 640" role="img" aria-labelledby="title description">
  <title id="title">Rokid VESC HUD example</title>
  <desc id="description">Monochrome green HUD with duty cycle, current speed, ride and board maximum speeds, battery, trip, range, temperatures, power, and connection status.</desc>
  <rect width="480" height="640" fill="#000"/>
  <g font-family="Arial,Helvetica,sans-serif" font-weight="700">
    <g fill="#008730" text-anchor="middle">
      <text x="70" y="157" font-size="18">DUTY</text>
      <text x="382" y="157" font-size="18">RIDE MAX</text>
      <text x="382" y="225" font-size="18">BOARD MAX</text>
      <text x="224" y="282" font-size="28">km/h</text>
    </g>
    <g fill="#00ff5a" text-anchor="middle">
      <text x="70" y="190" font-size="42">43%</text>
      <text x="224" y="218" font-size="126">32</text>
      <text x="382" y="190" font-size="42">34</text>
      <text x="382" y="258" font-size="42">42</text>
    </g>
    <line x1="42" y1="298" x2="438" y2="298" stroke="#008730" stroke-width="2"/>
    <g fill="#008730" font-size="24" text-anchor="start">
      <text x="48" y="342">BAT</text>
      <text x="48" y="394">TRIP</text>
      <text x="48" y="446">RANGE</text>
    </g>
    <g fill="#00ff5a" text-anchor="end">
      <text x="432" y="342" font-size="42">78%</text>
      <text x="432" y="394" font-size="36">12.6 km</text>
      <text x="432" y="446" font-size="36">21 km</text>
    </g>
    <g fill="#008730" text-anchor="middle">
      <text x="240" y="488" font-size="20">FET 41°C   MOT 48°C    620 W</text>
      <text x="240" y="522" font-size="18">LIVE • ADV2 • CAN 84</text>
    </g>
  </g>
</svg>
